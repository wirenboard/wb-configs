[device]
wifi.scan-rand-mac-address=no

# USB Debug Network gadget interfaces: dbg0 (RNDIS) and dbge0 (CDC ECM) are ports of
# the dbgbr bridge that carries the wb-debug shared connection
[device-ethernet-dbg0]
match-device=interface-name:dbg0;dbge0
managed=true
carrier-wait-timeout=500

[main]
rc-manager=file

[connection]
# disable wifi powersaving to keep AP online
wifi.powersave=2
