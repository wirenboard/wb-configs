# USB Debug Network: every host gets the same MAC from the gadget (host_addr is fixed in
# wb-utils) but its own DHCP client-id, and the /30 has a single address. Key leases by MAC
# so the next host reuses the lease instead of waiting for it to expire. Applies to every
# NetworkManager shared connection (wb-ap clients have unique MACs, no effect there).
dhcp-ignore-clid
