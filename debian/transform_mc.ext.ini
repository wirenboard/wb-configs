#!/bin/sh
# Adds Wiren Board firmware images (*.fit) to mc extension file:
# Enter browses the image with /usr/lib/mc/extfs.d/ufit, F3 shows image info.
# The section goes right after [mc.ext.ini] header, as mc uses the first matching section.

awk '
    /^\[mc\.ext\.ini\]/ {
        header = 1
    }
    header && /^\[/ && !/^\[mc\.ext\.ini\]/ {
        print "### Wiren Board firmware images ###"
        print "[wb-fit]"
        print "Regex=\\\\.fit$"
        print "RegexIgnoreCase=true"
        print "Open=%cd %p/ufit://"
        print "View=%view{ascii} /usr/lib/mc/extfs.d/ufit info %f"
        print ""
        header = 0
        done = 1
    }
    { print }
    END {
        if (!done) {
            print "mc.ext.ini: [mc.ext.ini] section is not found" > "/dev/stderr"
            exit 1
        }
    }
'
